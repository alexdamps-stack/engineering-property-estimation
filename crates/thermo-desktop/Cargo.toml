[package]
name = "thermo-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Native flowsheet editor with background calculation and project files."

[lints]
workspace = true

[dependencies]
eframe = "0.37.0"
# Status glyphs (✔ ⚠ ✖) need the bundled monochrome emoji fonts.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
flowsheet-core = { path = "../flowsheet-core" }
flowsheet-project = { path = "../flowsheet-project" }
property-packages = { path = "../property-packages" }
thermo-types = { path = "../thermo-types" }
rfd = "0.18"
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
