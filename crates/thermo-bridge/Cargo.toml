[package]
name = "thermo-bridge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Versioned C ABI (JSON v1) over the qualified cubic TP/PH package for external hosts such as DWSIM."

[lib]
name = "thermocore_bridge"
crate-type = ["cdylib", "rlib"]

# The workspace forbids unsafe code. The C ABI needs `#[unsafe(no_mangle)]` and
# raw-pointer handling, so this crate denies unsafe code instead and allows it
# only in the audited `ffi` module. `[lints] workspace = true` is not used:
# Cargo cannot override a single workspace lint per crate, and `forbid` cannot
# be relaxed by an inner `#[allow]`. All other lints restate [workspace.lints]
# exactly; tests/workspace_lints.rs fails if they drift.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
property-packages = { path = "../property-packages" }
thermo-types = { path = "../thermo-types" }
thermo-data = { path = "../thermo-data" }
thermo-models = { path = "../thermo-models" }
thermo-solvers = { path = "../thermo-solvers" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
