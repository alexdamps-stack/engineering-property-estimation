name: Numerical validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: AVX512F AVX512CD AVX512_KNL AVX512_KNM AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR

jobs:
  diag:
    name: diag py${{ matrix.py }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        py: ['3.12', '3.14']
        n: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install -r validation/reference-requirements.txt
      - name: fugacity
        run: |
          lscpu | grep -E "Model name"
          python validation/generate-gerg-fugacity-references.py --output /tmp/fug.json
          python validation/compare-reference-candidate.py /tmp/fug.json validation/fixtures/gerg-fugacity-v1.json || true
          python validation/generate-gerg-fugacity-references.py && echo FUGACITY-EXACT
      - name: equilibrium
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/gxx-baseline"
          ln -s "$GITHUB_WORKSPACE/validation/gxx-baseline.sh" "$RUNNER_TEMP/gxx-baseline/g++"
          export PATH="$RUNNER_TEMP/gxx-baseline:$PATH"
          python validation/generate-gerg-equilibrium-references.py --output /tmp/eq.json
          python validation/compare-reference-candidate.py /tmp/eq.json validation/fixtures/gerg-equilibrium-v1.json || true
          cmp <(python -c "import json,sys;print(json.load(open('/tmp/eq.json'))==json.load(open('validation/fixtures/gerg-equilibrium-v1.json')))") <(echo True) && echo EQUILIBRIUM-EXACT
