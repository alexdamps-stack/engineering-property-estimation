name: Numerical validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read

jobs:
  homogeneous:
    name: Homogeneous cubic sweep (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROPTEST_CASES: 2048
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Independent fixtures and fixed-seed property sweep
        run: cargo test -p thermo-types -p thermo-data -p thermo-models -p thermo-cli --release --locked -- --nocapture
      - name: Reproducible natural-gas case
        run: cargo run -p thermo-cli --release --locked -- examples/homogeneous-natural-gas.json
      - name: Reproducible binary case
        run: cargo run -p thermo-cli --release --locked -- examples/homogeneous-binary.json
