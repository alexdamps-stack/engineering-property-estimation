name: Rust CI

# Pushes to main plus pull requests: a PR branch push runs once (pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clapeyron:
    uses: ./.github/workflows/clapeyron.yml

  dwsim-bridge:
    name: DWSIM bridge CLR client checks (no DWSIM)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dwsim-bridge
      - name: Build bridge, compile .NET Framework client with csc and run CLR checks
        shell: pwsh
        run: ./integrations/dwsim/run-checks.ps1

  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install software Vulkan driver for headless UI rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check approved reference budgets and process provenance
        run: python validation/consolidate-tolerances.py
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  windows-package:
    name: Windows installer (build, install, self-test, uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-package
      - name: Install Inno Setup 6 if missing
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
      - name: Build executable, portable ZIP and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version 0.0.0
      - name: Self-test the built executable
        shell: pwsh
        run: |
          $exe = 'target\windows-package\stage\thermo-desktop.exe'
          $p = Start-Process $exe -ArgumentList '--self-test', 'target\windows-package\self-test.json' -Wait -PassThru
          Get-Content target\windows-package\self-test.json
          if ($p.ExitCode -ne 0) { throw "self-test failed with $($p.ExitCode)" }
      - name: Install, self-test installed copy, uninstall
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Setup target\windows-package\PropertyEstimationFlowsheet-0.0.0-x64-setup.exe
      - name: Upload installer, ZIP and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            target/windows-package/*.exe
            target/windows-package/*.zip
            target/windows-package/*.json
            target/windows-package/*.txt
            target/windows-package/*.log
          if-no-files-found: warn
