name: Rust CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clapeyron:
    name: Independent Clapeyron numerical check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
      - uses: julia-actions/cache@v2
      - name: Instantiate locked Julia reference environment
        run: julia --project=validation/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Compare current Rust calculations with live Clapeyron
        run: julia --project=validation/julia validation/julia/check.jl
      - name: Verify GERG phase EOS and equilibrium residuals with Clapeyron
        run: julia --compile=min --project=validation/julia validation/julia/check-gerg.jl

  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver for headless UI rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check approved reference budgets and process provenance
        run: python validation/consolidate-tolerances.py
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  windows-package:
    name: Windows installer (build, install, self-test, uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-package
      - name: Install Inno Setup 6 if missing
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build executable, portable ZIP and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version 0.0.0
      - name: Self-test the built executable
        shell: pwsh
        run: |
          $exe = 'target\windows-package\stage\thermo-desktop.exe'
          $p = Start-Process $exe -ArgumentList '--self-test', 'target\windows-package\self-test.json' -Wait -PassThru
          Get-Content target\windows-package\self-test.json
          if ($p.ExitCode -ne 0) { throw "self-test failed with $($p.ExitCode)" }
      - name: Install, self-test installed copy, uninstall
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Setup target\windows-package\PropertyEstimationFlowsheet-0.0.0-x64-setup.exe
      - name: Upload installer, ZIP and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            target/windows-package/*.exe
            target/windows-package/*.zip
            target/windows-package/*.json
            target/windows-package/*.txt
            target/windows-package/*.log
          if-no-files-found: warn
