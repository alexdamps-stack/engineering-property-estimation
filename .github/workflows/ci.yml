name: Rust CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clapeyron:
    name: Independent Clapeyron numerical check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
      - uses: julia-actions/cache@v2
      - name: Instantiate locked Julia reference environment
        run: julia --project=validation/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Compare current Rust calculations with live Clapeyron
        run: julia --project=validation/julia validation/julia/check.jl

  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver for headless UI rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
