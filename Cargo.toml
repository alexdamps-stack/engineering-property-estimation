[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thermo-types = { path = "crates/thermo-types" }
thermo-data = { path = "crates/thermo-data" }
thermo-models = { path = "crates/thermo-models" }
property-packages = { path = "crates/property-packages" }
