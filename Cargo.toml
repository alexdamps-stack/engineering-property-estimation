[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
# Declared once so JSON float parsing does not depend on feature unification:
# `float_roundtrip` parses every decimal to the exactly rounded f64 (the default
# parser can be 1 ulp off). Every crate uses `serde_json = { workspace = true }`.
serde_json = { version = "1", features = ["float_roundtrip"] }

# crates/thermo-bridge/Cargo.toml restates these lints (only `unsafe_code`
# differs); its tests/workspace_lints.rs fails if the two drift apart.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Distribution build for the Windows package (packaging/windows/build.ps1).
# Same optimisation level as `release`; LTO and one codegen unit reduce size
# and symbols are stripped. No floating-point semantics change.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
